<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0E5A63">
<title>هدهد — راهنمای خرید حضوری تهران</title>
<style>
:root{--bg:#eef3f3;--card:#fff;--fg:#183138;--muted:#617880;--line:#d9e3e5;--teal:#0e5a63;--gold:#f2c46d;--danger:#a92828}
*{box-sizing:border-box}html,body{margin:0;height:100%}body{font:15px/1.8 Tahoma,Arial,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
header{background:var(--teal);color:#fff;padding:11px 18px;display:flex;gap:15px;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:21px}header small{color:#d7e5e6}#status{font-size:12px}main{flex:1;overflow-y:auto;width:100%;padding:20px max(14px,calc((100vw - 850px)/2));display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;padding:11px 16px;border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere;background:var(--card);border:1px solid var(--line)}.msg.user{align-self:flex-end;background:var(--teal);color:#fff;border-color:var(--teal)}.msg.assistant{align-self:flex-start}.msg.error{color:var(--danger)}
.results,.question,.offers{align-self:stretch;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}.section-title{font-weight:bold;font-size:16px}.muted{color:var(--muted);font-size:12px}.card{border:1px solid var(--line);padding:12px;border-radius:11px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.card h3{font-size:14px;margin:0 0 6px}.price{font-weight:bold;color:var(--teal)}.tag{border-radius:8px;background:#e9f3f4;color:#185a62;font-size:12px;padding:2px 8px;display:inline-block;margin:2px 0 0 5px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 15px;background:var(--teal);color:#fff}button.subtle{background:#e5f0f1;color:var(--teal)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.choice{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:7px 10px;cursor:pointer}.choice input{accent-color:var(--teal)}.choice:has(input:checked){border-color:var(--teal);background:#f0f8f8}
#composer{border-top:1px solid var(--line);background:var(--card);padding:12px 16px}#formrow{max-width:850px;display:flex;gap:10px;align-items:end;margin:auto}#input{flex:1;min-height:47px;max-height:140px;resize:vertical;border:1px solid var(--line);border-radius:11px;padding:9px 12px;font:inherit}#send{min-height:47px;background:var(--teal)}
.note{max-width:850px;margin:auto;color:var(--muted);font-size:11px;padding:3px 0}a{color:#086776}a[rel]{overflow-wrap:anywhere} .hidden{display:none!important}.free{width:100%;border:1px solid var(--line);padding:9px;border-radius:8px;font:inherit}
@media (max-width:620px){main{padding:12px;gap:9px}.msg{max-width:98%}.card{grid-template-columns:1fr}.card button{width:100%}header{padding:10px}header h1{font-size:19px}} 
@media (prefers-color-scheme:dark){:root{--bg:#101c20;--card:#1c2b31;--fg:#e5eef0;--muted:#a1b4bd;--line:#385059;--teal:#13737a}.tag,.choice:has(input:checked),button.subtle{background:#294b51;color:#e1eeee}}
</style>
</head>
<body>
<header><div><h1>هدهد</h1><small>دستیار خرید حضوری تهران</small></div><span id="status">جست‌وجوی محصولات و فروشگاه‌ها</span></header>
<main id="log" aria-live="polite"></main>
<div id="composer"><form id="form" autocomplete="off"><div id="formrow">
<textarea id="input" rows="1" maxlength="1600" placeholder="مثلاً لپ‌تاپ لنوو برای دانشجو تا ۳۰ میلیون تومان" required></textarea>
<button id="send" type="submit">ارسال</button></div></form>
<div class="note"><button type="button" class="subtle" id="location" style="padding:3px 9px;font-size:12px">استفاده از موقعیت من (اختیاری)</button> قیمت‌ها و آفرها لحظه‌ای نیستند؛ نام و شمارهٔ بسیاری از فروشگاه‌های دیتاست مسابقه ساختگی‌اند. پیش از مراجعه موجودی را تأیید کنید.</div></div>
<script>
"use strict";
const log=document.getElementById('log'),input=document.getElementById('input'),form=document.getElementById('form'),send=document.getElementById('send');
const history=[];let busy=false,currentLocation=null;
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=String(text);return node;}
function scroll(){log.scrollTop=log.scrollHeight;}
function msg(role,content,cls=''){const node=el('div','msg '+role+' '+cls,content);log.append(node);scroll();return node;}
function csrf(){const match=document.cookie.match(/(?:^|;\s*)csrftoken=([^;]+)/);return match?decodeURIComponent(match[1]):'';}
async function api(url,body){const r=await fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRFToken':csrf()},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw Error(j.error||'خطای سرور');return j;}
function setBusy(value){busy=value;send.disabled=value;input.disabled=value;}
function price(value){return value===null||value===undefined?'قیمت نامشخص':Number(value).toLocaleString('fa-IR');}
function line(parent,kind,text){parent.append(el('div',kind,text));}
function linkMap(shop){if(shop.lat===null||shop.lng===null)return null;const a=el('a','', 'نمایش موقعیت روی نقشه');a.href='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(shop.lat+','+shop.lng);a.target='_blank';a.rel='noopener noreferrer';return a;}
function showResults(items){if(!Array.isArray(items)||!items.length)return;const section=el('section','results');section.append(el('div','section-title','پیشنهادهای محصولات'));
items.forEach(item=>{const p=item.product;if(!p)return;const card=el('article','card'),body=el('div');
body.append(el('h3','',p.title||p.title_en||'محصول بدون عنوان'));
line(body,'muted',[p.brand,p.category].filter(Boolean).join(' · '));
line(body,'price',item.min_price_toman!=null?'از '+price(item.min_price_toman)+' تومان':'قیمت با واحد تومان موجود نیست');
line(body,'muted',(item.seller_count||0)+' فروشنده ثبت‌شده');
if(item.reasons&&item.reasons.length)line(body,'muted',item.reasons.join('، '));
card.append(body);const b=el('button','subtle','دیدن فروشگاه‌ها');b.type='button';b.addEventListener('click',()=>loadOffers(p.id));card.append(b);section.append(card);});
log.append(section);scroll();}
async function loadOffers(productId){const wait=msg('assistant','در حال دریافت آفرهای این محصول…');try{const r=await fetch('/api/products/'+encodeURIComponent(productId)+'/offers/',{credentials:'same-origin'});const data=await r.json();if(!r.ok)throw Error(data.error||'خطا');wait.remove();const section=el('section','offers');section.append(el('div','section-title','فروشگاه‌های ثبت‌شده برای '+data.product.title));if(!data.offers.length)line(section,'muted','برای این محصول آفر ثبت‌شده‌ای پیدا نشد.');
data.offers.slice(0,20).forEach(o=>{const c=el('article','card'),bd=el('div');bd.append(el('h3','',o.shop.name||'فروشگاه '+o.shop.id));line(bd,'muted',o.shop.address||'آدرس ثبت نشده');line(bd,'price',o.price!=null?price(o.price)+' '+o.price_unit:'قیمت نامشخص');if(o.warranty){const w=o.warranty;line(bd,'muted','گارانتی: '+(typeof w==='object'?[w.period_months?w.period_months+' ماه':'',w.provider||'',w.description||''].filter(Boolean).join('، '):String(w)));}line(bd,'muted',o.updated_at?'آخرین تغییر قیمت: '+new Date(o.updated_at).toLocaleDateString('fa-IR'):'زمان به‌روزرسانی نامشخص');if(o.shop.installment===true)line(bd,'muted','خرید قسطی: اعلام شده');if(o.shop.name_may_be_pseudonymous)line(bd,'muted','نام فروشگاه ممکن است ساختگی باشد');c.append(bd);const m=linkMap(o.shop);if(m)c.append(m);section.append(c);});
line(section,'muted','وجود آفر به معنی موجودی قطعی نیست. قیمت و موجودی را پیش از مراجعه استعلام کنید.');log.append(section);scroll();}catch(e){wait.textContent=e.message;wait.classList.add('error');}}
function showClarification(q,candidateSetId){if(!q||!q.question||!Array.isArray(q.options))return;const section=el('section','question');section.append(el('div','section-title',q.question));const opts=el('form');let key='clarification_'+Math.random().toString(36).slice(2);
q.options.forEach((o,i)=>{const label=el('label','choice'),rad=el('input');rad.type='radio';rad.name=key;rad.value=String(i);if(!i)rad.checked=true;label.append(rad,el('span','',o.label+(o.count!=null?' ('+o.count+' محصول)':'')));opts.append(label);});
let free=null;if(q.allow_free_text){free=el('input','free');free.placeholder='یا پاسخ دلخواه خودتان را وارد کنید';free.type=q.field.includes('price')?'number':'text';free.min='0';free.maxLength=100;opts.append(free);}
const submit=el('button','', 'اعمال انتخاب');submit.type='submit';opts.append(submit);opts.addEventListener('submit',async e=>{e.preventDefault();if(busy)return;const choice=opts.querySelector('input[type="radio"]:checked');const custom=free&&free.value.trim();let val=custom!==''&&custom!=null?custom:q.options[Number(choice?.value||0)].value;if(q.field.includes('price'))val=Number(val);if(q.field.includes('price')&&(!Number.isFinite(val)||val<0)){msg('assistant','بودجهٔ معتبر وارد کنید.','error');return;}
setBusy(true);submit.disabled=true;try{const data=await api('/api/clarify/',{candidate_set_id:candidateSetId,field:q.field,value:val});section.remove();msg('user',q.field+': '+String(val));showResponse(data);}catch(err){msg('assistant',err.message,'error');submit.disabled=false;}finally{setBusy(false);}});
section.append(opts);log.append(section);scroll();}
function showInlineOffers(items){
  if(!Array.isArray(items)||!items.length)return;
  const section=el('section','offers');section.append(el('div','section-title','آفرهای ثبت‌شده مطابق درخواست'));
  items.slice(0,15).forEach(o=>{
    const card=el('article','card'),body=el('div'),shop=o.shop||{};
    body.append(el('h3','',shop.name||'فروشگاه ثبت‌شده'));
    line(body,'price',o.price!=null?price(o.price)+' '+(o.price_unit||'تومان'):'قیمت ثبت نشده');
    line(body,'muted',[shop.area,shop.address].filter(Boolean).join(' · '));
    if(o.warranty){let w=o.warranty;if(typeof w==='object')w=[w.period_months?w.period_months+' ماه':'',w.provider||'',w.description||''].filter(Boolean).join('، ');line(body,'muted','گارانتی: '+String(w));}
    if(shop.fast_delivery===true)line(body,'muted','ارسال فوری اعلام‌شده');
    if(Array.isArray(shop.payment_options)&&shop.payment_options.length)line(body,'muted','روش پرداخت: '+shop.payment_options.map(p=>p.provider+(p.channel==='unknown'?' (کانال نامشخص)':'')).join('، '));
    if(o.distance_km!=null)line(body,'muted','فاصلهٔ مستقیم: '+Number(o.distance_km).toLocaleString('fa-IR')+' کیلومتر');
    if(o.updated_at)line(body,'muted','آخرین ثبت قیمت: '+new Date(o.updated_at).toLocaleDateString('fa-IR'));
    if(shop.name_may_be_pseudonymous)line(body,'muted','نام فروشگاه در دادهٔ مسابقه ممکن است ساختگی باشد');
    card.append(body);const map=linkMap(shop);if(map)card.append(map);section.append(card);
  });
  line(section,'muted','شماره‌های دیتاست ساختگی‌اند و نمایش داده نمی‌شوند. قیمت، ساعت کار و موجودی را پیش از مراجعه تأیید کنید.');
  log.append(section);scroll();
}
function showResponse(data){if(data.candidate_set_id)window.currentSet=data.candidate_set_id;if(data.reply)msg('assistant',data.reply);showResults(data.ranking);showInlineOffers(data.offers);showClarification(data.clarification,data.candidate_set_id||window.currentSet);}
msg('assistant','سلام! چه محصولی می‌خواهید؟ نام مدل یا کاربرد و بودجه را بنویسید؛ بر اساس اطلاعات ثبت‌شده در دیتاست جست‌وجو می‌کنم.');
document.getElementById('location').addEventListener('click',()=>{
  if(!navigator.geolocation){msg('assistant','مکان‌یابی در این مرورگر در دسترس نیست.','error');return;}
  navigator.geolocation.getCurrentPosition(pos=>{
    currentLocation={lat:pos.coords.latitude,lng:pos.coords.longitude};
    msg('assistant','موقعیت برای رتبه‌بندی مکانی در همین مکالمه ثبت شد. مختصات به سرور ارسال می‌شود و اگر LLM فعال باشد، برای جست‌وجو در اختیار آن قرار می‌گیرد.');
  },()=>msg('assistant','مجوز دسترسی به موقعیت داده نشد یا مکان‌یابی ناموفق بود.','error'),{enableHighAccuracy:false,timeout:10000,maximumAge:60000});
});
input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey&&!event.isComposing){event.preventDefault();form.requestSubmit();}});
form.addEventListener('submit',async event=>{event.preventDefault();if(busy)return;const text=input.value.trim();if(!text)return;input.value='';msg('user',text);history.push({role:'user',content:text});while(history.length>16)history.shift();setBusy(true);const pending=msg('assistant','در حال جست‌وجو…');try{const data=await api('/api/chat/',{messages:history,location:currentLocation});pending.remove();showResponse(data);history.push({role:'assistant',content:data.reply||''});}catch(error){pending.remove();msg('assistant',error.message,'error');history.pop();}finally{setBusy(false);input.focus();}});
</script>
</body>
</html>
